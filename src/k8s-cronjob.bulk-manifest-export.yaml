apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-manifest-export-script
spec:
  schedule: "0 0 * * *" # This means the job will run once a day at midnight
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:      
        spec:
          containers:
          - name: bash-script
            image: your-docker-image:tag # Replace with your Docker image and tag
            imagePullPolicy: IfNotPresent
            volumeMounts:
            - name: secret-volume
              mountPath: /app/configs # Replace with the path where you want to mount the secret
            command: ["/bin/bash", "-c", "cp /app/configs/config-source /app/bulk-manifest-export.env && /app/bulk-manifest-export"] # Replace with your script
          imagePullSecrets:
            - name: your-secret-name # Replace with your image pull secret name
          restartPolicy: OnFailure
          volumes:
          - name: secret-volume
            secret:
              secretName: manifest-secret-name # Replace with your secret name
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multi-resource-access
rules:
- apiGroups: [""]
  resources: ["namespaces", "secrets", "configmaps", "services"]
  verbs: ["list", "get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["list", "get"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multi-resource-access-binding
subjects:
- kind: ServiceAccount
  name: default
  namespace: PLACEHOLDER_NAMESPACE # Replace with the namespace where the CronJob is running
roleRef:
  kind: ClusterRole
  name: multi-resource-access
  apiGroup: rbac.authorization.k8s.io